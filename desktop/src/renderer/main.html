<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; media-src 'self' data:; connect-src 'self'">
<title>DT Kalkan</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="bg"><div class="orb o1"></div><div class="orb o2"></div><div class="grain"></div></div>

<div id="titlebar">
  <div class="tb-brand"><img class="tb-logo" src="img/logo.svg" alt=""><span class="tb-name" id="tbName"></span></div>
  <div class="tb-center" id="tbCenter"></div>
  <div class="tb-btns">
    <button data-win="minimize" id="tbMin"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M1.5 6h9" stroke="currentColor" stroke-width="1.2"/></svg></button>
    <button data-win="maximize" id="tbMax"><svg width="12" height="12" viewBox="0 0 12 12"><rect x="1.8" y="1.8" width="8.4" height="8.4" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
    <button data-win="close" class="close" id="tbClose"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.2"/></svg></button>
  </div>
</div>

<div id="shell">
  <aside id="sidebar">
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="side-card" id="sideCard"><canvas id="sideMochi"></canvas><div><div class="sc-title" id="sideTitle"></div><div class="sc-sub" id="sideSub"></div></div></div>
      <div class="side-meta" id="sideMeta"></div>
    </div>
  </aside>
  <main id="content">
    <section class="view" id="v-dashboard"></section>
    <section class="view" id="v-scan"></section>
    <section class="view" id="v-results"></section>
    <section class="view" id="v-quarantine"></section>
    <section class="view" id="v-history"></section>
    <section class="view" id="v-settings"></section>
  </main>
</div>

<div id="globalDrop"><div><canvas id="gdMochi"></canvas><div class="gd-t" id="gdText"></div><div class="dim" id="gdSub" style="margin-top:6px"></div></div></div>
<div id="onboard"></div>
<div id="intro"></div>
<div id="modal"><div class="m-box" id="modalBox"></div></div>
<div id="snack"></div>

<script src="js/i18n.js"></script>
<script src="js/eula.js"></script>
<script src="js/icons.js"></script>
<script src="js/mochi.js"></script>
<script src="js/common.js"></script>
<script src="js/app.js"></script>
<script src="js/onboarding.js"></script>
<script src="js/settings.js"></script>
</body>
</html>
