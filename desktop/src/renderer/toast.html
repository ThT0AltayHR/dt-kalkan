<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; media-src 'self' data:; connect-src 'self'">
<link rel="stylesheet" href="css/base.css">
<style>
html, body { background: transparent !important; overflow: hidden; }
#stack { position: absolute; top: 4px; right: 6px; width: 380px; display: flex; flex-direction: column; gap: 10px; padding: 6px 6px 30px; }
.toast { position: relative; display: flex; gap: 12px; padding: 14px 14px 14px 12px; border-radius: 20px; color: #fff;
  background: linear-gradient(180deg, rgba(44,48,60,.94), rgba(30,33,42,.96)); border: 1px solid rgba(255,255,255,.1);
  box-shadow: 0 18px 40px -10px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08);
  transform: translateX(420px); opacity: 0; transition: transform .6s cubic-bezier(.22,1.25,.36,1), opacity .35s ease, margin .4s ease, max-height .4s ease;
  overflow: hidden; max-height: 220px; }
.toast::before { content: ''; position: absolute; inset: 0; background: radial-gradient(120% 90% at 0% 0%, rgba(var(--tone), .2), transparent 60%); pointer-events: none; }
.toast.in { transform: none; opacity: 1; }
.toast.out { transform: translateX(420px); opacity: 0; }
.toast.collapse { max-height: 0; padding-top: 0; padding-bottom: 0; margin-top: -10px; border-width: 0; }
.toast .ti { width: 46px; height: 46px; flex: none; border-radius: 14px; background: rgba(255,255,255,.06); display: grid; place-items: center; position: relative; }
.toast .ti img { width: 54px; height: 54px; margin: -4px; }
.toast .tb { flex: 1; min-width: 0; position: relative; }
.toast .th { display: flex; align-items: center; gap: 8px; }
.toast .app { font-size: 11px; color: rgba(255,255,255,.5); font-weight: 600; letter-spacing: .02em; text-transform: uppercase; }
.toast .when { margin-left: auto; font-size: 11px; color: rgba(255,255,255,.4); }
.toast .tt { font-family: var(--display); font-weight: 650; font-size: 15px; margin-top: 3px; }
.toast .bd { font-size: 13px; color: rgba(255,255,255,.72); margin-top: 2px; line-height: 1.4; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.toast .ac { display: flex; gap: 6px; margin-top: 10px; }
.toast .ac button { height: 30px; padding: 0 12px; border-radius: 9px; border: 0; background: rgba(255,255,255,.1); color: #fff; font: 600 12.5px var(--font); cursor: pointer; }
.toast .ac button:hover { background: rgba(255,255,255,.17); }
.toast .ac button.primary { background: rgb(var(--tone)); color: #0B0D12; }
.toast .x { position: absolute; top: 8px; right: 8px; width: 22px; height: 22px; border-radius: 11px; border: 0; background: rgba(255,255,255,.1); color: rgba(255,255,255,.8); display: grid; place-items: center; cursor: pointer; opacity: 0; transition: opacity .2s; z-index: 2; }
.toast:hover .x { opacity: 1; }
.toast:hover .when { opacity: 0; }
.toast .pb { position: absolute; left: 0; bottom: 0; height: 2px; background: rgba(var(--tone), .7); width: 100%; transform-origin: left; }
</style>
</head>
<body>
<div id="stack"></div>
<script src="js/i18n.js"></script>
<script src="js/icons.js"></script>
<script src="js/mochi.js"></script>
<script src="js/common.js"></script>
<script src="js/toast.js"></script>
</body>
</html>
